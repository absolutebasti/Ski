<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1a3a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="102" fill="url(#bgGrad)"/>
  
  <!-- Mountain shapes -->
  <path d="M50 400 L160 210 L265 345 L370 160 L460 400 Z" fill="#1e2540" opacity="0.8"/>
  <path d="M80 400 L185 250 L290 370 L400 200 L455 400 Z" fill="#2a3555" opacity="0.6"/>
  
  <!-- Snow caps -->
  <path d="M145 230 L160 210 L175 230 Z" fill="white" opacity="0.9"/>
  <path d="M355 180 L370 160 L385 180 Z" fill="white" opacity="0.9"/>
  
  <!-- Ski trail -->
  <path d="M210 130 Q265 240 225 350" stroke="url(#accentGrad)" stroke-width="10" fill="none" stroke-linecap="round"/>
  
  <!-- Skier icon -->
  <g transform="translate(180, 115)">
    <!-- Head -->
    <circle cx="32" cy="20" r="18" fill="url(#accentGrad)"/>
    <!-- Body -->
    <path d="M32 38 L32 95" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round"/>
    <!-- Arms with poles -->
    <path d="M12 60 L32 75 L52 60" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M6 60 L6 120" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M58 60 L58 120" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Skis -->
    <path d="M15 105 L50 105" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Speed lines -->
  <path d="M115 170 L85 180" stroke="#00d4ff" stroke-width="5" opacity="0.6" stroke-linecap="round"/>
  <path d="M105 200 L70 210" stroke="#00d4ff" stroke-width="5" opacity="0.4" stroke-linecap="round"/>
  <path d="M110 230 L80 235" stroke="#00d4ff" stroke-width="5" opacity="0.3" stroke-linecap="round"/>
</svg>

